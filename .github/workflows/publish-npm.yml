name: Publish Package - Node / NPM

on:
  push:
    branches: [ main ]

jobs:
  ci-build-node:
    uses: ./.github/workflows/build-node.yml

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: ci-build-node
    environment: node-push
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance
      id-token: write

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download Node Package Artifacts
        uses: actions/download-artifact@v5
        with:
          name: package-node-24
          path: dist

      - name: Publish to NPM Registry
        # Uses npm trusted publishing (OIDC) when configured on npmjs.com, otherwise falls back to NPM_TOKEN
        run: npm publish dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
