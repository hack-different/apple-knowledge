name: Continuous Integration - Quality Checks

on:
  workflow_call:
    inputs:
      # Counterintuitive, but this is the value for full history required for rev-list --count
      fetch-depth:
        default: 0
        required: false
        type: number

jobs:
  ci-test-root:
    name: "Integration Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Install OS Packages
        run: sudo apt-get update && sudo apt-get install -y libidn-dev cmake

      - name: Checkout Repository with History
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Ruby 4.0.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.5
          bundler-cache: true

      - name: Perform Default Rake Task
        run: bundle exec rake

      - name: Archive Data Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: data-artifacts
          path: _data
