name: Continuous Integration - Jekyll Site

on:
  workflow_call:
    inputs:
      # Counterintuitive, but this is the value for full history required for rev-list --count
      fetch-depth:
        default: 0
        required: false
        type: number

jobs:
  ci-build-site:
    name: Build Jekyll Site
    runs-on: ubuntu-latest

    steps:
      - name: Install OS Packages
        run: sudo apt-get update && sudo apt-get install -y libidn-dev cmake

      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Ruby 4.0.5
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.5
          bundler-cache: true

      - name: Build Jekyll Site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Site Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: data-ci-site
          path: _site
          include-hidden-files: true
