  point:
    description: A point on a cartisian plane.  This can be expressed typically as an ordered pair of integers, almost
      always always `X` and `Y`.  When used over a field, the values for `X` and `Y` are between 0 and n-1 and are
      always positive.  With elliptic curves, the values for `X` and `Y` are related, and therefore an alternate form
      exists where the `X` is encoded and only if the `Y` is positive or negative is encoded.  This is called
      "point compression" but the value represened is still an X and a Y value.  If the X and Y do not fall on the
      curve, the compressed point is invalid.
    parameters:
      encoding:
        type: enum
        values:
          uncompressed:
          compressed_positive:
          compressed_negative:
      x:
        type: positive_integer
      y:
        type: positive_integer
