          # Core Properties of GF(p)

          • Elements: The field consists of integers $\{0, 1, 2, \dots, p-1\}$.
          • Addition & Subtraction: Computed modulo p.
          • Multiplication: Computed modulo p.
          • Inverses: Every non-zero element has a unique multiplicative inverse because p is prime. [1, 5, 6]
  
          # Working with Prime Fields in GP/PARI

          • Integers modulo p: Use  to perform basic arithmetic rings/fields. For instance,  returns .
          • Defining via : You can initialize a prime field element or generator using  where p is prime.
          • Polynomial roots (): Find roots of polynomials over a prime field by passing the prime p as a domain
