algorithms:
  dh:
    description: !markdown >
      The Diffie-Hellman (DH) Key Exchange is a method that lets two people create a shared secret key over an open, public network. They do this without ever sending the secret key to each other, making it safe from people who might be listening. [1, 2]  
      How It Works 

      • Public Setup: Both users agree on two public numbers: a large prime number (p) and a base generator (g). 
      • Private Numbers: Each user picks a secret random number just for themselves (let's call them a and b). 
      • Public Key Math: They use math to turn their secret number and the public numbers into a new public key ($g^a \bmod p$ and $g^b \bmod p$). 
      • Key Exchange: They send these public results to each other over the network. 
      • Shared Secret: Each user takes the other person's public key, raises it to their own secret number, and arrives at the exact same final secret number. [3, 4, 5]  

      Why It Matters 

      • No Secret Sent: An eavesdropper can see the public numbers and public keys, but cannot figure out the private numbers or the final shared secret. 
      • Symmetric Prep: The final shared secret is then used as a key for fast, secure regular encryption (like AES) to chat or share data safely. [4, 6, 7]  

      If you'd like, I can explain the math step-by-step with simple numbers, or talk about modern versions like Elliptic Curve Diffie-Hellman (ECDH). Let me know what you prefer! 
      AI responses may include mistakes.

      [1] https://www.hypr.com/security-encyclopedia/diffie-hellman-algorithim
      [2] https://www.youtube.com/watch?v=KXq065YrpiU
      [3] https://doubleoctopus.com/security-wiki/encryption-and-cryptography/diffie-hellman-algorithm/
      [4] https://www.geeksforgeeks.org/computer-networks/implementation-diffie-hellman-algorithm/
      [5] https://www.sciencedirect.com/topics/computer-science/diffie-hellman-key-exchange
      [6] https://www.hexnode.com/blogs/explained/what-is-diffie-hellman-dh-key-exchange/
      [7] https://dev.to/techlabma/diffie-hellman-key-exchange-dhke-algorithm-505b



