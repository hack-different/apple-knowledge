block_cypher_modes:
  ecb:
    description: !markdown >
      Electronic Codebook (ECB) mode is the simplest and most basic block cipher mode of operation. It splits a message into fixed-size blocks and encrypts each block independently using the same secret key. Identical plaintext blocks always yield identical ciphertext blocks, making it insecure for most uses. [1, 2, 3, 4]  
      How ECB Works 

      • Splitting: Data is cut into equal chunks matching the block size (such as 16 bytes for AES). 
      • Independent Encryption: Each block is processed through the cipher separately without interaction from other blocks. 
      • Independent Decryption: Cipher blocks are decrypted individually back to text using the same key. [3, 4, 5]  

      Advantages 

      • Simplicity: Very easy to program and use. 
      • Parallel Processing: Blocks encrypt or decrypt simultaneously [0.12], saving time on multi-core systems. [4]  

      Security Weaknesses 

      • Pattern Leakage: Identical inputs create identical outputs, meaning visual shapes or data trends remain visible (famous for the "Tux the Penguin" encrypted image demonstration). 
      • No Hiding of Data: An attacker can swap, delete, or replay blocks [0.13] without detection. Most experts advise against using ECB for private or sensitive data. [2, 4]  

      If you want, I can explain:Cipher Block Chaining (CBC) as a secure alternativePadding methods used when data does not fit the block size evenly 
      AI responses may include mistakes.

      [1] https://www.geeksforgeeks.org/computer-networks/electronic-code-book-ecb-in-cryptography/
      [2] https://en.wikipedia.org/wiki/Block_cipher_mode_of_operation
      [3] https://destcert.com/resources/types-of-ciphers/
      [4] https://medium.com/@brsdncr/cryptography-lesson-notebook-1-aes-ecb-electronic-codebook-5baabcedfa59
      [5] https://www.youtube.com/watch?v=jDnenb9EHQk
  cbc:
    description: !markdown >
      Cipher Block Chaining (CBC) is a mode of operation for block ciphers where each plaintext block is combined with the previous ciphertext block using an exclusive-OR (XOR) operation before being encrypted. This chaining process ensures that identical plaintext blocks yield entirely different ciphertext outputs. [1, 2, 3]  
      How CBC Encryption Works 

      • Initialization Vector (IV): Because there is no previous ciphertext for the first plaintext block, a unique or random value called an IV is XORed with the first block. 
      • Chaining: For every subsequent block, the current plaintext block is XORed with the ciphertext output of the immediately preceding block. 
      • Encryption: The combined result of the XOR operation is then passed through the block cipher algorithm using the secret key. 
      • Sequential processing: Encryption must be performed strictly in sequence (serially) because block N cannot be encrypted until block N-1 finishes. [3, 4, 5]  

      How CBC Decryption Works 

      • Reverse process: The cipher takes a ciphertext block, runs it through the block cipher decryption function, and then XORs the result with the previous ciphertext block (or the IV for the first block) to recover the original plaintext. 
      • Parallel decryption: Unlike encryption, decryption can be done in parallel because all ciphertext blocks are already available. [3, 6]  

      Key Pros and Cons 

      • Pros: Hides patterns and prevents repetitive plaintext leaks (unlike basic ECB mode); highly secure when paired with a proper, unpredictable IV. 
      • Cons: Slower due to its sequential nature during encryption; prone to error propagation (a corrupted ciphertext block corrupts its own block decryption and distorts the next plaintext block). [5, 8, 9]  

