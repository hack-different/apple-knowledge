  ccm:
    description: !markdown >
      CCM (Counter with CBC-MAC) is an authenticated encryption mode for 128-bit block ciphers like AES. It provides both data confidentiality (encryption) and authenticity (integrity tag) in one operation. It combines Counter (CTR) mode for encryption and Cipher Block Chaining Message Authentication Code (CBC-MAC) for integrity. [1, 2, 3, 4, 5]  
      How CCM Works 

      • Two Core Parts: Uses CTR mode to encrypt the data and CBC-MAC to generate a security tag. 
      • Associated Data (AD): Can authenticate extra unencrypted data (like packet headers or IP addresses). 
      • Nonce Requirement: Requires a unique nonce (number used once) for every message under the same key to remain secure. Reusing a nonce breaks confidentiality entirely. [1, 2, 6]  

      Key Properties 

      • Block Size: Strictly defined for 128-bit block ciphers (such as AES-128). 
      • Order of Operation: Standard implementations compute the MAC over the associated data and plaintext first, then encrypt both the message and the tag using CTR mode. 
      • Common Uses: Widely used in constrained wireless networks, including IEEE 802.11i (Wi-Fi security), Bluetooth Low Energy, and ZigBee. [1, 2, 3, 6, 7]  

