  xex:
    description: !markdown >
      XEX (XOR-Encrypt-XOR) is a tweakable block cipher mode designed by Phillip Rogaway. It masks a plaintext block with a tweak value before and after block cipher encryption. XEX serves as the foundational core for XTS-AES, the standard mode used for secure storage and full-disk encryption. [1, 2, 3, 4, 5, 6]  
      How XEX Works 

      • Pre-whitening: The plaintext block is XORed with a masked tweak value (derived from a secondary key and a sector/block index). 
      • Encryption: The resulting value passes through the standard block cipher function (like AES) using the primary key. 
      • Post-whitening: The cipher output is XORed again with the same masked tweak value to produce the final ciphertext. 
      • Tweak evolution: Tweak values across adjacent blocks are modified by multiplying the previous tweak by a primitive element in a finite Galois Field (GF(2¹²⁸)). [3, 6, 7, 8, 9]  

      Key Characteristics 

      • Tweakable security: Ensures that identical plaintext blocks encrypt to different ciphertexts when located at different storage addresses or sector numbers. 
      • Parallelizable: Individual blocks can be encrypted or decrypted independently, allowing high performance on modern hardware. 
      • No authentication: Provides confidentiality for data at rest but does not protect against data tampering or active manipulation. [9, 10, 11, 12, 13]  

      If you are planning an implementation, would you like to explore how XEX transitions into XTS mode with ciphertext stealing, or do you need help with performance considerations for disk encryption? 
