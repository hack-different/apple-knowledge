  ecdhe:
    description: !markdown >
      ECDHE stands for Elliptic Curve Diffie-Hellman Ephemeral. It is a secure key exchange protocol that allows two parties to create a shared secret key over an open network without sending the secret itself. It combines elliptic curve math with temporary keys to give high speed and forward privacy. [1, 2]  
      How ECDHE Works 

      • Pick a Curve: Both sides agree on a specific elliptic curve and a base point on that curve. 
      • Make Key Pairs: Each side creates a random private number and multiplies it by the base point to get a public key. 
      • Trade Public Keys: The two sides swap their public keys over the network. 
      • Compute Secret: Each side combines the other side's public key with its own private number to arrive at the exact same shared secret number. [3, 4]  

      Core Benefits 

      • Ephemeral (Forward Secrecy): New temporary keys are made for every single session and then thrown away. If a server's main key is stolen later, old recorded sessions stay safe. 
      • Small Key Size: It offers the same security as older methods while using much smaller keys, which saves CPU power and network data. 
      • Widespread Use: It is a core security standard used inside modern web protocols like  Transport Layer Security (TLS)  to protect web traffic. [1, 9]  

      If you'd like, I can explain:The math difference between standard Diffie-Hellman and elliptic curvesWhy X25519 is the preferred curve todayHow it handles quantum computer risksLet me know what you want to explore next. 
