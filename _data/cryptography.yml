          description: The product of the two prime numbers p and q.
    description: !markdown >
      The RSA algorithm is a widely used method for secure data transmission. It is an asymmetric cryptographic
      system, meaning it uses two different keys: a public key to lock or encrypt the data, and a matching private
      key to unlock or decrypt it. [1, 2, 3]  
      
      # How It Works 
      
      The name RSA comes from its inventors: Ron Rivest, Adi Shamir, and Leonard Adleman. Its security relies 
      on a simple math rule: multiplying two large prime numbers is easy, but finding those original prime numbers
      back from the final product is very hard. 

      * Key Generation: The system picks two large prime numbers, multiplies them together, and uses the result to
          create a public key and a private key. 
      * Encryption: Anyone can use the receiver’s public key to turn a normal message into scrambled code (ciphertext). 
      * Decryption: Only the person with the secret private key can reverse the code and read the original
        message. [1, 5, 6]  

      # Common Uses
    citations: !citations
