  ecc:
    uses:
      - signature
      - encryption
      - key_derivation
    parameters:
      g:
        type: point
        name: Generator Point
        description: The generator point `G` on the elliptic curve.  This point is used to generate the private key.
      f:
        type: field
        name: Field
        description: The field `F` of the elliptic curve.  This is the set of numbers that the curve is defined over.
          A field is either a prime or binary field.  The field is the range of `0..x`
      a:
        type: integer
        description: The `a` co-factor of the elliptic curve equation.  The `a` is multiplied by the `x` value to
          perform the linear portion of the curve.
      b:
        type: integer
        description: The `b` co-factor of the elliptic curve equation.  The `b` is multiplied by `x^2` to perform the
          quadratic portion of the curve.
      h:
        name: Cofactor
        type: float
        description: The ratio of the total number of points on the curve to the order n, usually set to 1 for
          optimal security.  Anything less then 1 means that the number of bits expressed in the X value is less then
          a 1:1 relationship to the number of private keys in the field.
      n:
        name: Order
        type: positive_integer
        description: The order of the elliptic curve.  This is the number of points on the curve,
          including the point at infinity.
    private_key:
      n:
        type: positive_integer
        description: A number whereby the parameter point `G` or the generator is multiplied by `n`.  Point
          multiplication is a process whereby a point on an elliptic curve is added to itself `n` times.  The result
          of `n` point additions is in and of itself a new point on the curve.
        constraint:
          - positive
          - field
          - curve
    public_key:
      p:
        type: point
        description: A point on the elliptic curve that is `G` times `n`.  This point is in the field, on the curve,
          and not the point at infinity.
    description: !markdown >
      Elliptic Curve Cryptography (ECC) is a public-key encryption approach based on the algebra of elliptic curves
      over finite fields. It provides the same security as older methods like RSA but uses much smaller keys. This
      makes it fast and efficient for phones, web pages, and crypto coins. [1, 2, 3, 4, 5]  
      
      # How ECC Works 

      * The Curve: Uses a math equation plotted on a grid that makes a symmetric loop shape. 
      * Generator Point: A specific starting point (G) on the curve agreed upon by both users. 
      * Private Key: A random number picked in secret by the user. 
      * Public Key: Found by adding the generator point to itself over and over using the private key number. 
      * One-Way Math: It is easy to multiply the points forward, but nearly impossible to guess the private key backwards (known as the Elliptic Curve Discrete Logarithm Problem). [4, 6, 7, 8, 9]  

      # Key Benefits 

      * Smaller Size: A 256-bit ECC key offers about the same security as a massive 3072-bit RSA key. 
      * Less Power: Uses less battery, memory, and CPU power on small hardware. 
      * Faster Speed: Sets up secure connections quicker than older systems. [5, 6, 10, 11]  
