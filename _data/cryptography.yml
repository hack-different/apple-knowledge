  gcm:
    description: !markdown >
      Galois/Counter Mode (GCM) is an authenticated encryption mode for block ciphers. It provides both data confidentiality (secrecy) and authenticity (integrity). GCM combines Counter (CTR) mode for encryption with a special GHASH function based on Galois field multiplication for integrity verification. [1, 2, 3, 4]  
      Key Components and Operation 

      • Counter Mode (Encryption): Turns a block cipher into a stream cipher by encrypting sequential counter values and XORing the output with plaintext blocks. 
      • GHASH (Authentication): Processes the ciphertext, optional additional authenticated data (AAD), and length fields using universal hashing over a binary Galois field (GF(2¹²⁸)) to output a unique authentication tag. 
      • Nonce / IV: Requires a unique initialization vector (typically 96 bits) for every execution under the same key. Never reuse a nonce. [1, 3, 6]  

      Advantages of GCM 

      • High Speed: Supports parallel processing for both encryption and authentication, making it optimal for high-bandwidth networks. 
      • Single-Pass Efficiency: Computes privacy and integrity checks simultaneously rather than sequentially. 
      • Standard Adoption: Widely used in modern protocols like TLS 1.2+, IPsec, and SSH due to its security and performance. [4, 8, 9, 10, 11]  

      If you'd like, I can:Detail how to prevent nonce reuse vulnerabilitiesCompare GCM with CCM or ChaCha20-Poly1305 modesShow a basic code implementation overviewLet me know how you would like to proceed. 
