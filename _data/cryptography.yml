    description: !markdown >
      The RSA algorithm is a widely used method for secure data transmission. It is an asymmetric cryptographic
      system, meaning it uses two different keys: a public key to lock or encrypt the data, and a matching private
      key to unlock or decrypt it. [1, 2, 3]  
      
      # How It Works 
      
      The name RSA comes from its inventors: Ron Rivest, Adi Shamir, and Leonard Adleman. Its security relies 
      on a simple math rule: multiplying two large prime numbers is easy, but finding those original prime numbers
      back from the final product is very hard. 

      * Key Generation: The system picks two large prime numbers, multiplies them together, and uses the result to create a public key and a private key. 
      * Encryption: Anyone can use the receiver’s public key to turn a normal message into scrambled code (ciphertext). 
      * Decryption: Only the person with the secret private key can reverse the code and read the original message. [1, 5, 6]  

      # Common Uses 

      * Secure Web Traffic: Protecting data sent across HTTPS and SSL/TLS certificates. 
      * Digital Signatures: Proving that a message or software update really came from a trusted sender. 
      * Secure Logins: Used in protocols like SSH for remote computer access. [2, 3, 4, 7, 8]
    citations:
      1: https://www.geeksforgeeks.org/computer-networks/rsa-algorithm-cryptography/
      2: https://securew2.com/blog/what-is-rsa-asymmetric-encryption
      3: https://www.splunk.com/en_us/blog/learn/rsa-algorithm-cryptography.html
      4: https://www.encryptionconsulting.com/education-center/what-is-rsa/
      5: https://www.youtube.com/watch?v=vf1z7GlG6Qo
      6: https://entro.security/glossary/rsa-encryption/
      7: https://www.youtube.com/watch?v=Pq8gNbvfaoM
      8: https://www.cohesity.com/glossary/rsa-encryption/
  ecc:
    uses:
      - signature
      - encryption
      - key_derivation
    parameters:
      g:
        type: point
        description: The generator point `G` on the elliptic curve.  This point is used to generate the private key.
    private_key:
      n:
        type: positive_integer
        description: A number whereby the parameter point `G` or the generator is multiplied by `n`.  Point
          multiplication is a process whereby a point on an elliptic curve is added to itself `n` times.  The result
          of `n` point additions is in and of itself a new point on the curve.
        constraint:
          - positive
          - field
          - curve
    public_key:
      p:
        type: point
        description: A point on the elliptic curve that is `G` times `n`.  This point is in the field, on the curve,
          and not the point at infinity.
    description: !markdown >
      Elliptic Curve Cryptography (ECC) is a public-key encryption approach based on the algebra of elliptic curves
      over finite fields. It provides the same security as older methods like RSA but uses much smaller keys. This
      makes it fast and efficient for phones, web pages, and crypto coins. [1, 2, 3, 4, 5]  
      
      # How ECC Works 

      * The Curve: Uses a math equation plotted on a grid that makes a symmetric loop shape. 
      * Generator Point: A specific starting point (G) on the curve agreed upon by both users. 
      * Private Key: A random number picked in secret by the user. 
      * Public Key: Found by adding the generator point to itself over and over using the private key number. 
      * One-Way Math: It is easy to multiply the points forward, but nearly impossible to guess the private key backwards (known as the Elliptic Curve Discrete Logarithm Problem). [4, 6, 7, 8, 9]  

      # Key Benefits 

      * Smaller Size: A 256-bit ECC key offers about the same security as a massive 3072-bit RSA key. 
      * Less Power: Uses less battery, memory, and CPU power on small hardware. 
      * Faster Speed: Sets up secure connections quicker than older systems. [5, 6, 10, 11]  

