  ofb:
    description: !markdown >
      Output Feedback (OFB) mode turns a block cipher into a synchronous stream cipher. It encrypts an Initialization Vector (IV) and feeds that cipher output back into the next encryption round. This produces a keystream that is XORed with the plaintext to create the ciphertext. [1, 2, 3, 4]  
      How OFB Mode Works 

      • Keystream Generation: The cipher encrypts an IV to create the first output block. It feeds that output back into the cipher again to create the next block, repeating this process to form a continuous keystream. 
      • Encryption: The system XORs the generated keystream blocks with the plaintext blocks to produce the final ciphertext. 
      • Decryption: Decryption uses the exact same steps. It generates the identical keystream by encrypting the IV and XORs it with the ciphertext to recover the original plaintext. [4]  

      Key Features and Properties 

      • No Error Propagation: A bit error in the ciphertext only affects the single corresponding bit in the decrypted plaintext, rather than corrupting later blocks. 
      • Preprocessing: The system can generate the entire keystream before the plaintext is even available, speeding up real-time processing. 
      • No Parallel Encryption: Because each keystream block depends strictly on the output of the previous block, you cannot encrypt multiple blocks at the same time. 
      • IV Uniqueness: Reusing the same IV and secret key combination completely destroys security by repeating the exact same keystream. [7]  

      If you would like, I can compare OFB mode with CFB (Cipher Feedback) or CTR (Counter) mode to show how their feedback and performance differ. 
