    description: !markdown >
      SHA-1 hash is a 160-bit cryptographic checksum rendered as a 40-character hexadecimal string.
      Designed by the NSA, it converts any input data into a unique digital fingerprint. It is now considered
      cryptographically broken and insecure against collision attacks, meaning modern systems use SHA-256
      instead. [1, 2, 3, 4]
    
      ## Key Characteristics
  
      * Fixed Output: Always produces 160 bits (40 hex characters) regardless of input size.
      * One-Way Function: Cannot be reversed to reveal the original input data.
      * Avalanche Effect: Changing even a single character drastically changes the final hash output. [2, 3, 5, 6]

      ## Security Status and Deprecation

      * Cryptographic Collisions: Researchers successfully demonstrated practical collision attacks (finding two
          different inputs with the same hash). [4, 7]
      * Current Usage: Phased out of digital signatures, SSL certificates, and secure software repositories. [1, 4, 7]
      * Legacy Compatibility: Retained mostly for older version control systems (like checking file identifiers in
          Git) and non-adversarial checksum verifications. [5, 7]
