signature:
  dsa:
    description: !markdown >
      Digital Signature Algorithm (DSA) is a digital signature scheme that provides secure authentication and integrity
      for digital messages and documents. It is based on the mathematical difficulty of the discrete logarithm problem.
      DSA is widely used in various security protocols and applications, including secure communication, digital
      signatures, and key exchange. [3]
  ecdsa:
    description: !markdown >
      Elliptic Curve Digital Signature Algorithm (ECDSA) is a digital signature scheme that uses elliptic curve
      cryptography. It provides secure authentication and integrity for digital messages and documents. ECDSA is
      widely used in various security protocols and applications, including secure communication, digital signatures,
      and key exchange. [6]
  rsa:
    description: !markdown >
      The RSA signature algorithm is an asymmetric cryptographic scheme used to authenticate the origin of digital messages or documents. It works by using a private key to mathematically "sign" a message hash, which anyone with the corresponding public key can verify to prove authenticity and detect tampering. [1, 2, 3, 4]  
      Key Pair Components 

      • Public Key: Consists of the modulus n and the public exponent e, used to verify signatures. 
      • Private Key: Consists of the modulus n and the private exponent d, kept secret and used to generate signatures. [2, 5]  

      Signature Generation (Signing) 

      • Compute the hash value of the message: h = hash(msg). 
      • Raise the hash to the power of the private exponent d modulo n to create the signature: $s = h^d \pmod n$. 
      • Send the signature along with the original message. [2, 4, 6]  

      Signature Verification 

      • Compute the hash value of the received message: h = hash(msg). 
      • Raise the signature to the power of the public exponent e modulo n to recover the hash: $h' = s^e \pmod n$. 
      • Compare the calculated hash h with the recovered hash h'. If they match, the signature is valid. [2, 4, 7, 8]  

      Would you like to explore how RSA key generation works mathematically or compare it with ECDSA? 
      AI responses may include mistakes.

      [1] https://www.geeksforgeeks.org/computer-networks/rsa-and-digital-signatures/
      [2] https://cryptobook.nakov.com/digital-signatures/rsa-signatures
      [3] https://www.encryptionconsulting.com/education-center/what-is-rsa/
      [4] https://www.youtube.com/watch?v=TeuKV5kHLyQ
      [5] https://en.wikipedia.org/wiki/RSA_cryptosystem
      [6] https://securew2.com/blog/what-is-rsa-asymmetric-encryption
      [7] https://cryptobook.nakov.com/digital-signatures/rsa-signatures
      [8] https://students.cs.byu.edu/~cs465ta/lectures/rsa_notes.pdf


