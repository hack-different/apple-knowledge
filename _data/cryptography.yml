          A prime Galois field, denoted as $\mathbb{F}_p$ or GF(p), is a finite field with a prime number
          p of elements, where arithmetic operations like addition and multiplication are performed modulo p. In the
          PARI-GP computer algebra system, prime fields and elements within them are handled natively using integers
