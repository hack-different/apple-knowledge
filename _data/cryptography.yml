  ecdh:
    description: !markdown >
      The Elliptic Curve Diffie-Hellman (ECDH) algorithm is a modern security protocol. It lets two people create a shared secret key over an open, unsafe network. They use this secret key to lock and unlock private messages. It relies on the math of elliptic curves instead of large numbers. [1, 2]  
      How the Steps Work 

      • Choose a public curve and a starting point (G) together. 
      • Pick a random secret number to act as your private key. 
      • Multiply your private key by the starting point to make your public key. 
      • Send your public key to the other person. 
      • Take the public key sent to you and multiply it by your own private key. 
      • Both people now share the exact same secret value. [1, 3, 4, 5, 6]  

      Why People Use It 

      • Small keys: It gives high security using tiny key sizes. 
      • Fast speed: It uses less computer power and memory. 
      • Safe data: Hackers cannot figure out the secret key just by watching the network. [1, 7, 8]  

      If you'd like, I can explain:The math difference between normal Diffie-Hellman and ECDHWhat ECDHE (Ephemeral) means for forward safetyHow it is used in TLS or messaging apps 
