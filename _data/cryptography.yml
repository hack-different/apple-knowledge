  nist:
    description: !markdown >
      The term NIST DRNG usually refers to NIST DRBG (Deterministic Random Bit Generator), which is the official technical term used by the National Institute of Standards and Technology (NIST) for a cryptographically secure pseudorandom number generator (PRNG). [1, 2] 
      It can also refer to a physical Digital Random Number Generator (such as Intel's hardware-based DRNG architecture) designed to comply with NIST's rigid cryptographic standards. [3, 4, 5] 
      ------------------------------
      ## The NIST SP 800-90 Core Standards
      NIST regulates random number generation through the SP 800-90 series, which dictates how secure random numbers must be processed, seeded, and tested: [2, 6, 7, 8] 

      * 
      * [SP 800-90A](https://csrc.nist.gov/projects/random-bit-generation): Specifies the approved deterministic algorithms (DRBGs) used to expand a highly random mathematical "seed" into a stream of secure cryptographic bits.
      * SP 800-90B: Outlines the rules for the underlying physical entropy sources (the raw noise source providing true randomness).
      * [SP 800-90C](https://csrc.nist.gov/News/2025/nist-publishes-sp-800-90c): Establishes construction standards for combining the entropy source and the DRBG mechanism together seamlessly. [1, 2, 6, 9, 10] 
      * 

      ## Approved NIST DRBG Mechanisms
      When designing a software or hardware system to meet NIST compliance, developers must choose from three currently approved cryptographic mechanisms defined in SP 800-90A: [11, 12] 

      * 
      * CTR_DRBG: Built on symmetric block ciphers like AES in counter mode.
      * Hash_DRBG: Built on secure cryptographic hash functions like SHA-256.
      * HMAC_DRBG: Built on Hash-based Message Authentication Codes. [11, 13] 
      * 

      (Note: An older standard, Dual_EC_DRBG, was formally withdrawn and banned by NIST after it was discovered to contain a potential backdoor). [11, 14] 
      ## Hardware Implementations (Intel & AMD DRNG)
      In hardware architectures, a "DRNG" framework typically bundles an on-chip True Random Number Generator (TRNG) with a deterministic circuit. For example, Intel's onboard architecture uses a physical thermal noise source to consistently feed a NIST-compliant CTR_DRBG. Software applications then access these random pools using assembly commands: [3, 15, 16, 17] 

      * 
      * RDRAND: Pulls pseudorandom data directly out of the internal DRBG engine.
      * RDSEED: Pulls raw, high-entropy bits straight from the conditioning hardware to seed other software-based PRNGs. [3, 15, 18, 19, 20] 
      * 

      ## Testing for Compliance
      To verify that a DRNG functions correctly without predictability or bias, developers evaluate its outputs using the [NIST Statistical Test Suite (SP 800-22)](https://csrc.nist.gov/projects/random-bit-generation/documentation-and-software). This suite subjects output bitstreams to 15 distinct frequency, pattern, and matrix mathematical tests to spot hidden statistical anomalies. [21, 22, 23, 24, 25] 
      ------------------------------
      If you are implementing or auditing a random number generator, let me know:

      * 
      * Are you working on a software application or a hardware/firmware implementation?
      * Do you need help choosing a specific cryptographic algorithm (like AES-CTR vs. SHA-256)?
      * Are you prepping a module for FIPS 140-3 validation?
      * 

