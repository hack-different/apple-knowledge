  rsa:
    description: !markdown >
      The RSA Cryptosystem is a public-key encryption method named after Ron Rivest, Adi Shamir, and Leonard Adleman.
      It uses two mathematically linked keys: a public key to lock (encrypt) messages and a private key to unlock
      (decrypt) them. Its security relies on the fact that multiplying large prime numbers is easy, but factoring
      their product back is very hard. [1, 2, 3]  
      
      # Key Generation 

      * Pick two distinct, large prime numbers, p and q. 
      * Multiply them to find the modulus n = p × q. 
      * Compute Euler's totient function: φ(n) = (p - 1)(q - 1). 
      * Choose an integer e (the public exponent) such that 1 &lt; e &lt; φ(n) and e is coprime to φ(n). 
      * Calculate d (the private exponent) as the modular multiplicative inverse of e modulo φ(n), meaning $(d \times e) \pmod{\phi(n)} = 1$. 
      * Public Key: (n, e) (shared with everyone). 
      * Private Key: (n, d) (kept secret). [1, 4, 5]  

      # Encryption 

      * Turn your message into a number m, where 0 ≤ m &lt; n. 
      * Compute the ciphertext c using the formula: $c = m^e \pmod{n}$. 
      * Send c to the receiver. [2, 5, 6, 7]  

      # Decryption 

      * Take the encrypted number c. 
      * Recover the original message m using the private key d: $m = c^d \pmod{n}$. [2, 5]  

    citations:
      1: https://www.geeksforgeeks.org/computer-networks/rsa-algorithm-cryptography/
      2: https://www.encryptionconsulting.com/education-center/what-is-rsa/
      3: https://www.techtarget.com/cybersecurity/definition/What-is-the-RSA-algorithm
      4: https://www.youtube.com/watch?v=Pq8gNbvfaoM
      5: https://entro.security/glossary/rsa-encryption/
      6: https://www.britannica.com/topic/RSA-encryption
