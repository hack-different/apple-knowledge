      - Length Extension Attacks
    efficacy: Exceptionally efficient on standard CPUs, which commonly feature optimized implementations
    description: !markdown >
      SHA-2 (Secure Hash Algorithm 2) is a set of cryptographic hash functions designed by the NSA. It turns data of
      any size into a fixed-length text or number string (a "hash"). Common types include SHA-256 and SHA-512, which
      are used to keep data safe and check file integrity. [1, 2, 3, 4]
      
      ## Key Features

      * One-Way: You cannot turn a hash back into the original data.
      * Unique: Even a tiny change in the input changes the whole hash.
      * Secure: It replaced older, broken hashes like SHA-1 and MD5. [1, 4, 5]

      ## Main Types

      * SHA-256: Uses 256 bits; the most common choice for web security and digital signatures.
      * SHA-512: Uses 512 bits; faster on 64-bit systems and offers higher security levels.
      * SHA-224 & SHA-384: Truncated or modified versions for specific size needs. [1, 4, 5, 6, 7]
