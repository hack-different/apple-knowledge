rng:
  ansi-x9.62:
    description: !markdown >
      The ANSI X9.62 RNG is a legacy pseudorandom number generator specified in Annex A.4 of the 1998 ANSI X9.62
      standard for the Elliptic Curve Digital Signature Algorithm (ECDSA). It was widely used in financial
      cryptography to generate secret keys and nonces, but it has been deprecated and disallowed since
      January 1, 2016. [1, 2, 3, 4, 5]  
      
      # Overview and Status 

      * Origin: Defined in ANSI X9.62-1998 Annex A.4 (). 
      * Purpose: Designed to supply cryptographically secure random values specifically for ECDSA operations. 
      * Current Status: Retired and deprecated by NIST under SP 800-131A guidelines. 
      * Reason for Retirement: Advances in cryptanalysis and modern security requirements rendered legacy 1998-era designs like X9.62 and X9.31 vulnerable or insufficient compared to modern Deterministic Random Bit Generators (DRBGs) like CTR_DRBG or Hash_DRBG. [1, 2, 4, 5]  

      # Technical Context 

      * Function: Relied on internal state updates combined with secret/seed values (requiring roughly 20 to 64 bytes of seed material depending on implementation details). 
      * Replacements: Modern standards transitioned toward NIST SP 800-90A DRBGs (such as HMAC-DRBG, Hash-DRBG, and CTR-DRBG) for all cryptographic randomness. [4, 8, 9]
    citations:
      [1] https://cseweb.ucsd.edu/classes/fa21/cse107-a/slides/18-rngs.pdf
      [2] https://csrc.nist.rip/projects/Cryptographic-Algorithm-Validation-Program/Validation-Notes
      [3] https://csrc.nist.rip/projects/cryptographic-algorithm-validation-program/validation-notes
