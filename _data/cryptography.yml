    binary:
      description: !markdown >
        Binary fields, or  Galois Fields  denoted as $GF(2^m)$ where m ≥ 1, are finite fields containing $2^m$
        elements. The simplest binary field is GF(2) with elements $\{0, 1\}$, where arithmetic operations follow
        modulo 2 rules (addition is XOR, multiplication is AND). Larger fields $GF(2^m)$ represent elements as
        binary polynomials reduced modulo an irreducible primitive polynomial. [1, 2, 3, 4, 5]
        
        # Core Properties of Binary Fields
        
        * Order: Exactly $2^m$ elements, usually representing m-bit words or bytes (e.g., GF(2⁸) in AES encryption).
        * Characteristic: Every binary field has characteristic 2, meaning x + x = 0 for any element.
        * Addition and Subtraction: Implemented as a bitwise  XOR operation , meaning addition is identical
            to subtraction.
        * Multiplication: Carried out via polynomial multiplication followed by reduction using a fixed
            irreducible reduction polynomial without carry propagation (carry-less
            multiplication). [1, 2, 3, 5, 6, 7, 8]
        
        # Applications
        
        * Cryptography: Used in block ciphers like  AES  (GF(2⁸)) and elliptic curve cryptography.
        * Error Correction: Utilized in Reed-Solomon codes and cyclic redundancy checks (CRCs) for
            reliable data transmission. [5, 6, 7, 9]
      citations:
