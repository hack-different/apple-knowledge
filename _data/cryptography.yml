  xts:
    description: !markdown >
      XTS (XEX-based tweaked-codebook mode with ciphertext stealing) is a block cipher mode designed specifically for full-disk and storage encryption. It secures data at rest by using two keys and a "tweak" value (like a sector number) so identical data blocks yield different ciphertexts, without expanding file sizes. [1, 2, 3]  
      Key Features of XTS 

      • Two Keys: It uses two independent cipher keys—one for the core block encryption and one to encrypt the tweak value. 
      • The Tweak: It uses a tweak value (position/sector ID) modified via Galois field math. This stops attackers from spotting patterns in identical blocks across different disk sectors. 
      • No Size Expansion: It uses ciphertext stealing to handle final partial blocks. This avoids padding, meaning the encrypted data matches the exact size of the original data. 
      • Confidentiality Only: It provides strong data privacy, but it does not offer built-in authentication or tamper detection. [3, 4]  

      Common Uses 

      • Full-Disk Encryption: Used by software like  VeraCrypt  and BitLocker. 
      • Hardware Drives: Used inside secure external SSDs and USB flash drives like the Kingston IronKey. [2, 4, 5, 8, 9]  

      If you'd like, I can explain:How ciphertext stealing works mathematicallyA comparison between XTS and CBC or GCM modesPotential security limitations of XTSLet me know what you want to explore next. 
