sha3:
    status: future-proofing
    construction: sponge
    recommended: true
    efficacy: Exceptionally efficient on customized ASICs/FPGAs, currently lacks broad support on standard CPUs
    description: !markdown > 
      SHA-3 (Secure Hash Algorithm 3) is the latest cryptographic hash standard released by the National Institute of
      Standards and Technology (NIST). It converts any input data into a unique, fixed-length digital fingerprint
      called a hash. [1, 2, 3]
      
      Unlike earlier algorithms like SHA-1 and SHA-2, which rely on the Merkle–Damgård structure, SHA-3 is built on a
      completely different design called Keccak and utilizes a unique sponge construction. This fundamental structural
      difference ensures that if a theoretical vulnerability is ever discovered in SHA-2, SHA-3 will remain entirely 
      unaffected as a secure backup. [2, 3, 4]
      
      ## Standard SHA-3 Variants
      
      According to the [NIST FIPS 202 Publication](https://nvlpubs.nist.gov/nistpubs/fips/nist.fips.202.pdf), the
      SHA-3 family is officially split into four fixed-length hash functions and two flexible Extendable-Output
      Functions (XOFs): [5, 6, 7]

      ### SHAKE128 & SHAKE256
      
      XOF variants that can squeeze out a hash of any requested bit length. [8, 9, 10]

      ## How the "Sponge" Works
      
      The algorithm processes data in two distinct phases: [2, 11, 12]

      1. Absorbing Phase: The input data is split into blocks, XORed into the internal state matrix, and thoroughly
          mixed using a 1600-bit permutation function called Keccak-p. [2, 13]
      2. Squeezing Phase: The internal data state continues to permute while the desired number of output bits are
          read out to form the final secure hash. [2, 10]

      If you are writing software, you can test hashing functions locally using free browser environments
      like the [Codeshack SHA-3 Generator](https://codeshack.io/sha3-hash-generator/) or the Emn178 GitHub
      Page. [4, 14, 15, 16, 17]
