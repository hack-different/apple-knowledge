agreement:
  dh:
    description: !markdown >
      The Diffie-Hellman (DH) key agreement algorithm is a foundational cryptographic protocol that allows two parties to establish a shared secret key over an insecure communication channel without explicitly transmitting the key itself. Published by Whitfield Diffie and Martin Hellman in 1976, it was the first practical implementation of public-key cryptography. Once the shared secret is calculated, it is typically passed to a key derivation function to generate symmetric keys for high-speed encryption algorithms like AES. [1, 2, 3, 4]  
      The Mathematical Framework 
      The security of the DH algorithm relies entirely on the mathematical complexity of the Discrete Logarithm Problem. While it is computationally easy to raise a number to a power modulo a prime, it is extremely difficult to reverse that operation and find the exponent if the numbers are sufficiently large. [5, 6]  
      The protocol relies on two public parameters: 

      • p (Modulus): A very large, random prime number. 
      • g (Generator): A primitive root modulo p. [2, 7]  

      Step-by-Step Process 

      1. Parameter Agreement: Alice and Bob publicly agree on a modulus p and a generator g. Eavesdroppers can see these values. 
      2. Private Key Selection: Alice chooses a secret integer a, and Bob chooses a secret integer b. Neither party ever shares their private integer. 
      3. Public Key Computation: 

      	• Alice computes her public key: $A = g^a \pmod p$. 
      	• Bob computes his public key: $B = g^b \pmod p$. [10]  

      4. Public Key Exchange: Alice sends A to Bob, and Bob sends B to Alice across the insecure channel. 
      5. Shared Secret Calculation: 

      	• Alice calculates the secret using Bob's public key: $S = B^a \pmod p$. 
      	• Bob calculates the secret using Alice's public key: $S = A^b \pmod p$. [8, 10, 11, 12, 13]  

      Both mathematical formulas yield the exact same value because modular exponentiation is commutative: $S = (g^b)^a \pmod p = (g^a)^b \pmod p = g^{ab} \pmod p$ 
      Strengths and Variants 

      • Forward Secrecy: When implemented as Ephemeral Diffie-Hellman (DHE), new random keys are chosen for every single session. If a long-term master key is compromised in the future, attackers still cannot decrypt past recorded sessions. 
      • Elliptic Curve Diffie-Hellman (ECDH): A modern variant that uses the algebraic structure of elliptic curves instead of traditional modular arithmetic. It achieves the same level of security as standard DH but with significantly smaller key sizes, making it much faster and more efficient. [4, 14, 15, 16, 17]  

      Core Limitation: No Authentication 
      The raw Diffie-Hellman protocol does not authenticate the identities of the communicating parties. Because of this flaw, it is fully vulnerable to a Man-in-the-Middle (MITM) attack. An attacker sitting between Alice and Bob can silently intercept the public keys, substitute their own, and establish separate shared secrets with both sides. To remain secure in real-world protocols like TLS/HTTPS and IPsec VPNs, DH must always be combined with an authentication mechanism, such as digital certificates or digital signatures. [1, 6, 9]  
      Would you like to explore how Elliptic Curve Diffie-Hellman (ECDH) reduces key sizes, or should we look at a code implementation of standard DH? 

