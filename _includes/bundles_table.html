<table>
    <thead>
    <tr>
        <th>Bundle Identifier</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.bundles.bundles %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td>{{ entry[1].description }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
