<table>
    <thead>
    <tr>
        <th>UUID / Code</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.bluetooth.uuids %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td>{{ entry[1].description | default: entry[1].descritpion }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
