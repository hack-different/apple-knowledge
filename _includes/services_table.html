<table>
    <thead>
    <tr>
        <th>Service Name</th>
        <th>Binary</th>
        <th>Platforms</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.services.launchd_services %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td><code>{{ entry[1].binary }}</code></td>
        <td>{{ entry[1].platforms | join: ", " }}</td>
        <td>{{ entry[1].description }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
