<table>
    <thead>
    <tr>
        <th>Type</th>
        <th>Value</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.mach_o.file_types %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td><code>{{ entry[1].value }}</code></td>
        <td>{{ entry[1].description }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
