<table>
    <thead>
    <tr>
        <th>Property / Service</th>
        <th>Type</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.bridgeos.local_properties %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td>{{ entry[1].type | default: "property" }}</td>
        <td>{{ entry[1].description }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
