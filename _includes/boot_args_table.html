<table>
    <thead>
    <tr>
        <th>Boot Argument</th>
        <th>Description</th>
    </tr>
    </thead>
    <tbody>
    {% for entry in site.data.boot_args.boot_args %}
    <tr>
        <td><code>{{ entry[0] }}</code></td>
        <td>{{ entry[1].description }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
